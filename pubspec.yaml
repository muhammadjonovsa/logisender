name: logisender
description: "LogiSender Pro - Professional Logistics Freight Advertisement Manager"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  tg: ^0.0.20
  t: ^228.0.0

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # UI
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  collection: ^1.19.1
  equatable: ^2.0.7
  logger: ^2.5.0
  path_provider: ^2.1.5

  # Permissions & Background
  permission_handler: ^11.4.0
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^17.2.2

  # Connectivity
  connectivity_plus: ^6.1.3
  http: ^1.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/icons/img1.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/img1.png"
  adaptive_icon_foreground_color: "#FFFFFF"